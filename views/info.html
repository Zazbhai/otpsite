<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Stats — {{SITE_NAME}}</title>
  <meta name="robots" content="noindex, nofollow">
  {{THEME_INIT}}
  <link rel='icon' type='image/x-icon' href='{{SITE_FAVICON}}'>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    :root {
      --stat-bg: rgba(255, 255, 255, 0.03);
      --stat-border: rgba(255, 255, 255, 0.08);
    }

    .stats-header {
      margin-bottom: 40px;
      text-align: center;
    }

    .stats-header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(to right, #fff, var(--accent));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-header p {
      color: #94a3b8;
      margin-top: 8px;
    }

    .info-layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .grid-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .metric-card {
      background: var(--stat-bg);
      border: 1px solid var(--stat-border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .metric-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      background: rgba(var(--accent-rgb, 59, 130, 246), 0.05);
    }

    .metric-label {
      font-size: 14px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .metric-value {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
    }

    .chart-container {
      background: var(--stat-bg);
      border: 1px solid var(--stat-border);
      border-radius: 32px;
      padding: 32px;
      margin-bottom: 40px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .chart-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .table-container {
      background: var(--stat-bg);
      border: 1px solid var(--stat-border);
      border-radius: 32px;
      padding: 0;
      overflow: hidden;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 992px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .stats-header h1 {
        font-size: 24px;
      }

      .metric-value {
        font-size: 24px;
      }

      .chart-container,
      .table-container {
        padding: 20px;
        border-radius: 24px;
      }

      .stats-table td,
      .stats-table th {
        padding: 12px 16px;
        font-size: 13px;
      }

      .service-name {
        font-size: 14px;
      }

      .service-icon {
        width: 28px;
        height: 28px;
        font-size: 12px;
      }

      .chart-container {
        margin-bottom: 20px;
      }
    }

    .table-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--stat-border);
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
    }

    .stats-table th {
      text-align: left;
      padding: 16px 32px;
      background: rgba(255, 255, 255, 0.02);
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats-table td {
      padding: 20px 32px;
      border-bottom: 1px solid var(--stat-border);
      font-size: 15px;
    }

    .stats-table tr:last-child td {
      border-bottom: none;
    }

    .service-name {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .service-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
    }

    .share-bar-bg {
      width: 100px;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
    }

    .share-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: 0.5s;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid var(--accent);
      border-bottom-color: transparent;
      border-radius: 50%;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="loading-overlay" id="loading">
    <div class="loader"></div>
  </div>

  <div class="info-layout">
    <div class="stats-header">
      <h1>STATS</h1>
      <p>Real-time analytics for top services and platform performance</p>
    </div>

    <div class="grid-metrics">
      <div class="metric-card">
        <span class="metric-label">Total Orders</span>
        <span class="metric-value" id="m-total-orders">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Completed Orders</span>
        <span class="metric-value" id="m-orders">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Success Rate</span>
        <span class="metric-value" id="m-rate">0%</span>
      </div>
    </div>

    <div class="grid-2" style="grid-template-columns: 1fr;">
      <div class="chart-container">
        <div class="chart-header">
          <h2>Market Share</h2>
        </div>
        <div style="height: 300px; position: relative;">
          <canvas id="shareChart"></canvas>
        </div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h2 style="font-size: 20px; font-weight: 700;">Top Services Breakdown</h2>
      </div>
      <div class="table-wrap">
        <table class="stats-table">
          <thead>
            <tr>
              <th>Service</th>
              <th>Purchases</th>
              <th>Market Share</th>
            </tr>
          </thead>
          <tbody id="stats-body">
            <!-- Data will be injected here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    async function fetchData() {
      try {
        const res = await fetch(window.location.pathname + (window.location.pathname.endsWith('/') ? '' : '/') + 'data');
        const data = await res.json();
        render(data);
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => document.getElementById('loading').remove(), 500);
      } catch (e) {
        console.error(e);
      }
    }

    function render(data) {
      // Metrics
      document.getElementById('m-total-orders').textContent = data.metrics.total_orders.toLocaleString();
      document.getElementById('m-orders').textContent = data.metrics.completed_orders.toLocaleString();

      const rate = data.metrics.total_orders > 0 ? (data.metrics.completed_orders / data.metrics.total_orders * 100).toFixed(1) : 0;
      document.getElementById('m-rate').textContent = rate + '%';

      // Table
      const body = document.getElementById('stats-body');
      const totalPurchases = data.top_services_breakdown.reduce((acc, s) => acc + s.purchases, 0) || 1;

      body.innerHTML = data.top_services_breakdown.map(s => {
        const share = (s.purchases / totalPurchases * 100).toFixed(1);
        const iconHtml = s.image
          ? `<img src="${s.image}" style="width:32px;height:32px;border-radius:10px;object-fit:cover" onerror="this.outerHTML='<div class=\'service-icon\' style=\'background:${s.color || 'var(--accent)'}\'>${s.service.charAt(0)}</div>'">`
          : `<div class="service-icon" style="background:${s.color || 'var(--accent)'}">${s.service.charAt(0)}</div>`;

        return `
          <tr>
            <td>
              <div class="service-name">
                ${iconHtml}
                ${s.service}
              </div>
            </td>
            <td style="font-weight: 600;">${s.purchases.toLocaleString()}</td>
            <td>
              <div style="display: flex; align-items: center; gap: 12px;">
                <div class="share-bar-bg" style="width: 150px;">
                  <div class="share-bar-fill" style="width: ${share}%"></div>
                </div>
                <span style="font-size: 12px; color: #94a3b8; min-width: 35px;">${share}%</span>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      // Chart
      new Chart(document.getElementById('shareChart'), {
        type: 'bar',
        data: {
          labels: data.top_services_breakdown.slice(0, 10).map(s => s.service),
          datasets: [{
            label: 'Orders',
            data: data.top_services_breakdown.slice(0, 10).map(s => s.purchases),
            backgroundColor: [
              '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981',
              '#6366f1', '#f43f5e', '#06b6d4', '#84cc16', '#a855f7'
            ],
            borderRadius: 8,
            borderWidth: 0,
            barThickness: 20
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: 'rgba(0,0,0,0.8)',
              padding: 12,
              titleFont: {
                size: 14,
                weight: 'bold'
              },
              bodyFont: {
                size: 13
              }
            }
          },
          scales: {
            x: {
              grid: {
                color: 'rgba(255,255,255,0.05)',
                drawBorder: false
              },
              ticks: {
                color: '#94a3b8',
                font: {
                  size: 11
                }
              }
            },
            y: {
              grid: {
                display: false,
                drawBorder: false
              },
              ticks: {
                color: '#fff',
                font: {
                  size: 13,
                  weight: '600'
                }
              }
            }
          }
        }
      });
    }

    fetchData();
  </script>
</body>

</html>
