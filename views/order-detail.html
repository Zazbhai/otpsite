<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Detail — {{SITE_NAME}}</title>
  {{THEME_INIT}}
  <link rel='icon' type='image/x-icon' href='{{SITE_FAVICON}}'>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .detail-page {
      max-width: 520px;
      margin: 0 auto;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      animation: slideDown 0.4s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .detail-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-2);
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .detail-back:hover {
      color: var(--accent);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
    }

    .status-badge.active::before {
      background: var(--success);
      animation: pulse-badge 2s infinite;
    }

    .status-badge.completed {
      background: var(--accent-glow, rgba(59, 130, 246, 0.3));
      color: var(--accent);
    }

    .status-badge.completed::before {
      background: var(--accent);
    }

    .status-badge.refunded {
      background: rgba(245, 158, 11, 0.12);
      color: var(--warning);
    }

    .status-badge.refunded::before {
      background: var(--warning);
    }

    .status-badge.expired,
    .status-badge.cancelled {
      background: rgba(100, 116, 139, 0.12);
      color: var(--text-3);
    }

    /* Skeleton Loading */
    .skeleton-shell {
      animation: skeleton-shimmer 1.5s infinite linear;
      background: linear-gradient(90deg, var(--surface) 25%, var(--bg-1) 50%, var(--surface) 75%);
      background-size: 200% 100%;
    }

    @keyframes skeleton-shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .skeleton-text {
      height: 14px;
      border-radius: 4px;
      margin: 8px 0;
      width: 60%;
    }

    .skeleton-title {
      height: 24px;
      width: 40%;
      margin-bottom: 16px;
      border-radius: 6px;
    }

    @keyframes pulse-badge {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }
    }

    .phone-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .phone-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--service-color, var(--grad-primary));
    }

    .phone-icon {
      width: 64px;
      height: 64px;
      background: var(--grad-primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      box-shadow: 0 8px 24px var(--accent-glow, rgba(59, 130, 246, 0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .phone-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-3);
      margin-bottom: 12px;
    }

    .phone-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 2px;
      margin-bottom: 20px;
      word-break: break-all;
      animation: fadeIn 0.6s ease 0.2s both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .phone-number.pending {
      color: var(--text-3);
      font-size: 16px;
      letter-spacing: 0;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .copy-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--accent-glow, rgba(59, 130, 246, 0.3));
    }

    .copy-btn.copied {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .copy-btn:active {
      transform: scale(0.95);
    }

    .otp-card-main {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .otp-card.jiggle {
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      margin: 0 auto;
    }

    .otp-card.prev {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: none;
      transform: scale(0.95);
      opacity: 0.8;
      width: 100%;
      max-width: 320px;
      margin: 8px auto 0;
    }

    .otp-text {
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      word-break: break-word;
    }

    .otp-label-mini {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .prev-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      margin: 24px 0 8px;
      text-align: center;
    }

    .prev-messages-scroll {
      width: 100%;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 4px;
      margin-bottom: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .prev-messages-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .prev-messages-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }


    .otp-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-3);
      margin-bottom: 16px;
    }

    .otp-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 4px;
      margin-bottom: 24px;
      animation: otpReveal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes otpReveal {
      from {
        opacity: 0;
        transform: scale(1.1);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .jiggle {
      animation: jiggle 0.5s ease;
    }

    @keyframes jiggle {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px) rotate(-1deg);
      }

      50% {
        transform: translateX(4px) rotate(1deg);
      }

      75% {
        transform: translateX(-2px) rotate(-0.5deg);
      }
    }

    .otp-waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .otp-waiting-text {
      color: var(--text-3);
      font-size: 15px;
    }

    .otp-dots {
      display: flex;
      gap: 8px;
    }

    .otp-dots span {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      animation: dotBounce 1.4s infinite ease-in-out;
    }

    .otp-dots span:nth-child(1) {
      animation-delay: 0s;
    }

    .otp-dots span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .otp-dots span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: scale(0);
        opacity: 0.3;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .timer-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 16px;
      animation: slideUp 0.4s ease 0.2s both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .timer-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-icon {
      width: 40px;
      height: 40px;
      background: rgba(245, 158, 11, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .timer-text {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 2px;
    }

    .timer-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--warning);
      letter-spacing: 2px;
    }

    .cancel-lock-card {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: slideUp 0.4s ease 0.2s both;
    }

    .lock-icon {
      width: 44px;
      height: 44px;
      background: rgba(245, 158, 11, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .lock-text {
      flex: 1;
    }

    .lock-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .lock-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: var(--warning);
      font-weight: 600;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      animation: slideUp 0.4s ease 0.3s both;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row:hover {
      background: var(--surface-2);
    }

    .info-label {
      font-size: 13px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .info-value.mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
    }

    .action-section {
      animation: slideUp 0.4s ease 0.4s both;
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      margin-bottom: 12px;
    }

    .action-btn:last-child {
      margin-bottom: 0;
    }

    .action-btn.primary {
      background: var(--grad-primary);
      color: #fff;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    }

    .action-btn.primary:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.4);
    }

    .action-btn.danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .action-btn.danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.2);
      transform: translateY(-2px);
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .action-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      text-align: center;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      text-align: center;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .error-message {
      color: var(--text-2);
      margin-bottom: 20px;
    }

    .buy-new-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(var(--accent-rgb), 0.08);
      border: 1px solid rgba(var(--accent-rgb), 0.15);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }

    .buy-new-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--accent-glow, rgba(59, 130, 246, 0.3));
    }

    .buy-new-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    @media (max-width: 640px) {
      .phone-number {
        font-size: 20px;
      }

      .otp-code {
        font-size: 36px;
        letter-spacing: 8px;
      }

      .info-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }

    /* Glassmorphism Active Orders Switcher */
    .active-orders-bar {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 12px 6px 24px;
      margin-bottom: 24px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      mask-image: linear-gradient(to right, black 85%, transparent 100%);
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      perspective: 1000px;
    }

    .active-orders-bar::-webkit-scrollbar {
      display: none;
    }

    .active-order-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 22px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      scroll-snap-align: center;
      position: relative;
      overflow: hidden;
      animation: pillSlideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pillSlideIn {
      from {
        opacity: 0;
        transform: translateX(40px) rotateY(20deg) scale(0.8);
      }

      to {
        opacity: 1;
        transform: translateX(0) rotateY(0) scale(1);
      }
    }

    .active-order-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(var(--accent-rgb, 59, 130, 246), 0.5);
      color: var(--text);
      transform: scale(1.08) translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .active-order-pill.current {
      background: linear-gradient(135deg, rgba(var(--accent-rgb, 59, 130, 246), 0.25) 0%, rgba(var(--accent-rgb, 59, 130, 246), 0.1) 100%);
      border: 1px solid rgba(var(--accent-rgb, 59, 130, 246), 0.4);
      color: var(--accent);
      box-shadow: 0 0 25px rgba(var(--accent-rgb, 59, 130, 246), 0.25), inset 0 0 15px rgba(var(--accent-rgb, 59, 130, 246), 0.1);
      transform: scale(1.15) translateY(-2px);
      z-index: 10;
    }

    .active-order-pill.current::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, transparent, rgba(var(--accent-rgb, 59, 130, 246), 0.4), transparent);
      z-index: -1;
      border-radius: inherit;
      animation: pillGlowBorder 3s linear infinite;
    }

    @keyframes pillGlowBorder {
      0% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        opacity: 0.3;
      }
    }

    .active-order-pill .pill-indicator {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--success);
      animation: pulse-indicator 2s infinite;
    }

    @keyframes pulse-indicator {
      0% {
        transform: scale(1);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      70% {
        transform: scale(1.2);
        opacity: 0.8;
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }

      100% {
        transform: scale(1);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .active-order-pill.current .pill-indicator {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    /* ─────────────────────────────────────────
       Modern Card — UNIFIED styles for ALL states
       (active, completed, refunded, expired, cancelled)
       ───────────────────────────────────────── */
    .modern-card-container {
      background: var(--surface);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 24px;
      /* Single neutral border — same for every status */
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      opacity: 1;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    /* Hover identical for all cards */
    .modern-card-container:hover {
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      transform: translateY(-2px);
    }

    @keyframes orderGlow {
      0% { 
        transform: scale(1);
        border-color: var(--success);
        box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.8), 0 0 15px rgba(16, 185, 129, 0.5);
      }
      15% { 
        transform: scale(1.03);
        border-color: var(--success);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 1), 0 0 25px rgba(16, 185, 129, 0.7);
      }
      85% { 
        transform: scale(1.03);
        border-color: var(--success);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 1), 0 0 25px rgba(16, 185, 129, 0.7);
      }
      100% { 
        transform: scale(1);
        border-color: var(--border);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
    }

    .modern-card-container.otp-glow {
      animation: orderGlow 3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 10;
    }

    /* Cancelled / expired: black and white like classic */
    .modern-card-container.cancelled,
    [data-theme="dark"] .modern-card-container.cancelled {
      background: #000 !important;
      color: #fff !important;
      border-color: #333 !important;
      opacity: 0.85;
    }

    .modern-card-container.cancelled .modern-phone-section,

<body>
  <nav class="navbar">
    <div class="container">
      <a href="/dashboard/buy" class="nav-logo">⚡ {{SITE_NAME}}</a>
      <div class="nav-links" id="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/dashboard/buy">Buy</a>
        <a href="/dashboard/orders" class="active">Orders</a>
        <a href="/dashboard/wallet">Wallet</a>
      </div>
      <button class="nav-burger" id="nav-burger">☰</button>
    </div>
  </nav>

  <div class="layout">
    <main class="main-content">
      <div class="detail-page">
        <div id="active-orders-switcher" class="active-orders-bar" style="display: none;">
          <!-- Active orders will be injected here -->
        </div>

        <div class="detail-header">
          <a href="/dashboard/buy" class="detail-back">← Back</a>
          <div id="status-badge" class="status-badge active">
            <span>Loading...</span>
          </div>
        </div>

        <div id="loading-state" class="loading-container">
          <div class="loading-spinner"></div>
          <div style="color: var(--text-3)">Loading order...</div>
        </div>

        <div id="error-state" class="error-container" style="display: none;">
          <div class="error-icon">⚠️</div>
          <div id="error-message" class="error-message">Something went wrong</div>
          <button class="btn btn-secondary" onclick="loadOrder()">Try Again</button>
        </div>

        <div id="modern-content" style="display: none; margin-top: 10px;"></div>
      </div>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/ambient-bg.js"></script>

  <script>
    if (!requireLogin()) { }

    let orderId = location.pathname.split('/').pop();
    let orderData = null;
    let countdownInterval = null;
    let cancelLockInterval = null;

    window.switchOrder = function (newId) {
      if (newId === orderId) return;
      clearAllIntervals();
      orderId = newId;
      orderData = null;
      history.pushState(null, '', `/dashboard/orders/${newId}`);
      loadOrder();
    };

    window.showLoading = function () {
      const el = document.getElementById('loading-state');
      const err = document.getElementById('error-state');
      const con = document.getElementById('content');
      const mod = document.getElementById('modern-content');
      if (el) el.style.display = 'flex';
      if (err) err.style.display = 'none';
      if (con) con.style.display = 'none';
      if (mod) mod.style.display = 'none';
    }

    window.showError = function (message) {
      const el = document.getElementById('loading-state');
      const err = document.getElementById('error-state');
      const con = document.getElementById('content');
      const mod = document.getElementById('modern-content');
      if (el) el.style.display = 'none';
      if (err) { err.style.display = 'flex'; const msg = document.getElementById('error-message'); if (msg) msg.textContent = message || 'Failed to load order'; }
      if (con) con.style.display = 'none';
      if (mod) mod.style.display = 'none';
    }

    window.showContent = function (isModern = false) {
      const el = document.getElementById('loading-state');
      const err = document.getElementById('error-state');
      const con = document.getElementById('content');
      const mod = document.getElementById('modern-content');

      if (el) el.style.display = 'none';
      if (err) err.style.display = 'none';

      if (isModern) {
        if (con) con.style.display = 'none';
        if (mod) mod.style.display = 'block';
      } else {
        if (con) con.style.display = 'block';
        if (mod) mod.style.display = 'none';
      }
    }

    window.clearAllIntervals = function () {
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
      if (cancelLockInterval) { clearInterval(cancelLockInterval); cancelLockInterval = null; }
    }

    window.updateUI = async function (o, activeOrdersPrefetched = null) {
      if (!o) return;
      orderData = o;

      const modernContainer = document.getElementById('modern-content');

      let activeOrders = activeOrdersPrefetched;
      if (!activeOrders) {
        try {
          const res = await API.get('/api/user/orders?status=active&limit=100');
          activeOrders = res.orders || [];
        } catch (e) { activeOrders = []; }
      }

      const allToDisplay = [...activeOrders];
      const exists = allToDisplay.find(x => String(x.order_id || x.id) === String(o.order_id));
      if (!exists) {
        allToDisplay.push(o);
      } else {
        const idx = allToDisplay.findIndex(x => String(x.order_id || x.id) === String(o.order_id));
        allToDisplay[idx] = { ...allToDisplay[idx], ...o };
      }

      // Show Modern Grid exclusively
      showContent(true);
      if (modernContainer) {
        modernContainer.style.display = 'block';
        loadActiveOrders(activeOrders || null); // Pass prefetched list — avoids redundant API fetch
      }

      // Global status is now handled by loadActiveOrders to account for all orders
    }

    let orderIntervals = {};

    window.clearAllOrderIntervals = function () {
      Object.keys(orderIntervals).forEach(id => {
        if (orderIntervals[id].countdown) clearInterval(orderIntervals[id].countdown);
        if (orderIntervals[id].cancelLock) clearInterval(orderIntervals[id].cancelLock);
      });
      orderIntervals = {};
    }

    window.getModernUIHTML = function (o, index = null) {
      const statusMap = { active: 'Active', completed: 'Completed', refunded: 'Refunded', expired: 'Cancelled', cancelled: 'Cancelled' };
      const isActuallyCancelled = ['cancelled', 'expired', 'refunded', 'completed'].includes(o.status);
      const statusLabel = `<div class="modern-status-pill ${o.status}">${statusMap[o.status] || 'Active'}</div>`;

      const badgeHtml = index !== null ? `<div class="modern-order-badge">Order #${index + 1}</div>` : '';

      const date = new Date(o.createdAt);
      const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit', year: 'numeric' }) + ', ' +
        date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

      let smsHtml = '';
      const allMessages = [...new Set(((o.all_otps && o.all_otps.length) ? o.all_otps : [o.otp]).filter(x => !!x))];
      const oid = o.order_id || o.id;
      if (allMessages.length > 0) {
        const reversed = [...allMessages].reverse();
        smsHtml = reversed.map((m, i) => {
          const extracted = extractOTP(m);
          const hasFullText = m.length > extracted.length + 5;

              ${hasFullText ? `<div class="modern-full-sms">${m}</div>` : ''}

      } else {
        smsHtml = `

      const serverName = o.server_name || 'Global Server';

      let displayPhone = o.phone || 'Pending...';

      const hasOtp = (o.all_otps && o.all_otps.length > 0) || !!o.otp;
      const isLocked = !hasOtp && o.min_cancel_at && new Date(o.min_cancel_at) > new Date();

      const hasChecker = isCheckerSupported(o.service_name);
      const checkerCached = window._checkerCache && window._checkerCache[oid];
      let checkerBoxHtml = '';
      if (hasChecker) {
        if (checkerCached) {
          if (checkerCached.status === 'registered') {
            checkerBoxHtml = `
              <div id="checker-box-${oid}" class="checker-result-box registered">

          } else if (checkerCached.status === 'not_registered') {
            checkerBoxHtml = `

                <div style="display:flex; align-items:center; gap:6px;">
                  <span class="material-symbols-outlined" style="font-size:16px;">check_circle</span>
                  <span><strong>NOT REGISTERED</strong> (Fresh for ${getCheckerDisplayName(o.service_name)})</span>
                </div>
                <button onclick="event.stopPropagation(); checkOrderRegistration('${oid}', '${o.service_name}')" style="background:none;border:none;color:inherit;cursor:pointer;opacity:0.8;font-size:11px;display:flex;align-items:center;gap:2px;" title="Re-check">
                  <span class="material-symbols-outlined" style="font-size:14px;">refresh</span>
                </button>
              </div>`;
          } else {
            checkerBoxHtml = `
              <div id="checker-box-${oid}" class="checker-result-box error">
                <div style="display:flex; align-items:center; gap:6px;">
                  <span class="material-symbols-outlined" style="font-size:16px;">error</span>
                  <span>${checkerCached.error || 'Check failed'}</span>
                </div>
                <button onclick="event.stopPropagation(); checkOrderRegistration('${oid}', '${o.service_name}')" style="background:none;border:none;color:inherit;cursor:pointer;opacity:0.8;font-size:11px;display:flex;align-items:center;gap:2px;" title="Retry">
                  <span class="material-symbols-outlined" style="font-size:14px;">refresh</span> Retry
                </button>
              </div>`;

          checkerBoxHtml = `<div id="checker-box-${oid}" class="checker-result-box" style="display:none;"></div>`;
        }
      }

      return `
      <div class="modern-card-container ${isActuallyCancelled ? 'cancelled' : ''}" id="modern-card-${oid}">
        ${badgeHtml}
        <div class="modern-card-header" onclick="switchOrder('${oid}')" style="cursor:pointer">
          <div class="modern-country-box">
            <div class="modern-service-icon" style="width:28px;height:28px;border-radius:7px;margin-right:6px">
              ${getServiceIcon({ name: o.service_name, image_url: o.service_image, icon_color: o.service_color }, '20px')}
            </div>
            <div class="modern-country-info">
              <span class="modern-country-name" style="font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span>${o.service_name} — ${o.server_country || o.country || 'Global'}</span>
                ${typeof getCheckerBadgeHtml === 'function' ? getCheckerBadgeHtml(o.service_name, 'font-size:9px;padding:1px 5px;') : ''}
              </span>
              <span class="modern-server-name" style="font-size:11px">${o.server_name || 'Mapped Server'}</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            ${statusLabel}
            <div id="cancel-action-${oid}">
              ${o.status === 'active' ? `
                <button class="modern-copy-btn cancel-card-btn" 
                        id="cancel-btn-${oid}"
                        ${isLocked ? 'disabled' : `onclick="event.stopPropagation(); cancelOrder('${oid}')"`}
                        title="Cancel Order">
                  ${isLocked ? `
                    <span style="font-size:10px; font-weight:700;" id="cancel-lock-timer-${oid}">--:--</span>
                  ` : `
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

              ` : ''}

        <div class="modern-phone-section">
          <div>

          <div style="display:flex; gap:6px; align-items: center;">
            ${o.can_rebuy && !o.rebuy_order_id ? `
              <button class="modern-copy-btn" onclick="event.stopPropagation(); rebuyNumber('${oid}')" title="Rebuy this number" style="display:flex;align-items:center;gap:6px;padding:0 10px;width:auto">
                <span class="material-symbols-outlined" style="font-size:16px">replay</span><span>Rebuy</span>
              </button>
            ` : ''}
            ${o.can_rebuy_after_cancel && !o.rebuy_order_id ? `
              <button class="modern-copy-btn" onclick="event.stopPropagation(); cancelForRebuy('${oid}')" title="Cancel activation before rebuy" style="display:flex;align-items:center;gap:6px;padding:0 10px;width:auto">
                <span class="material-symbols-outlined" style="font-size:16px">cancel</span><span>Cancel for rebuy</span>

                <span class="material-symbols-outlined" style="font-size:15px;">verified_user</span>
                <span>Check</span>
              </button>
            ` : ''}
            <button class="modern-copy-btn" onclick="copyText('${(o.phone || '').replace(/^\+?91/, '')}', 'Phone number')" title="Copy Number">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button class="modern-copy-btn buy-new-card-btn" onclick="event.stopPropagation(); buyNewNumber('${o.service_id}')" title="Get New Number">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>

        <div style="padding:12px 16px">${orderReferencesHtml(o)}</div>

        <div class="modern-timers" id="timers-${oid}">

            </div>

        <div class="modern-sms-section">
          <div class="modern-sms-label">

            <span>${allMessages.length} Message${allMessages.length === 1 ? '' : 's'}</span>
          </div>
          <div class="modern-sms-list">
            ${smsHtml}
          </div>
        </div>

        <div id="actions-${oid}" style="margin-top: 8px;">
          <!-- Action buttons injected here -->
        </div>
      </div>
    `;
    };

    window.initOrderTimer = function (o) {
      const oid = o.order_id || o.id;
      if (!orderIntervals[oid]) orderIntervals[oid] = { countdown: null, cancelLock: null };
      const intervals = orderIntervals[oid];

      const timerSection = document.getElementById(`timers-${oid}`);
      if (timerSection) {
        timerSection.innerHTML = renderInitialModernTimers(o);
      }

      if (o.status === 'active' && o.expires_at) {
        if (!intervals.countdown) {
          const expires = new Date(o.expires_at).getTime();
          const tick = () => {
            const timerEl = document.getElementById(`timer-${oid}`);
            if (!timerEl) return;
            const diff = expires - Date.now();
            if (diff <= 0) { timerEl.textContent = '00:00'; return; }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
          };
          tick();
          intervals.countdown = setInterval(tick, 1000);
        }
      } else {
        if (intervals.countdown) { clearInterval(intervals.countdown); intervals.countdown = null; }
      }

      const hasOtp = (o.all_otps && o.all_otps.length > 0) || !!o.otp;

      if (o.status === 'active' && o.min_cancel_at && !hasOtp) {
        if (!intervals.cancelLock) {
          const minCancel = new Date(o.min_cancel_at).getTime();
          const tick = () => {
            const timerEl = document.getElementById(`cancel-lock-timer-${oid}`);
            
            const diff = minCancel - Date.now();
            if (diff <= 0) { 
              const actionsContainer = document.getElementById(`cancel-action-${oid}`);
              if (actionsContainer) {
                actionsContainer.innerHTML = `
                  <button class="modern-copy-btn cancel-card-btn" onclick="event.stopPropagation(); cancelOrder('${oid}')" title="Cancel Order">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                  </button>`;
              }
              clearInterval(intervals.cancelLock);
              intervals.cancelLock = null;
              return; 
            }
            if (timerEl) timerEl.textContent = formatTime(Math.ceil(diff / 1000));
          };
          tick();
          intervals.cancelLock = setInterval(tick, 1000);
        }
      } else {
        if (intervals.cancelLock) { clearInterval(intervals.cancelLock); intervals.cancelLock = null; }
      }

      const actionsSection = document.getElementById(`cancel-action-${oid}`);
      if (actionsSection) {
        let canCancel = o.status === 'active' && (hasOtp || !o.min_cancel_at || new Date(o.min_cancel_at) <= new Date());
        if (o.status === 'active') {
          if (canCancel) {
            actionsSection.innerHTML = `
              <button class="modern-copy-btn cancel-card-btn" onclick="event.stopPropagation(); cancelOrder('${oid}')" title="Cancel Order">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>`;
          } else {
            actionsSection.innerHTML = `<span style="font-size:10px; color:var(--text-3); font-weight:700; background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:4px; display:flex; align-items:center; gap:4px;">🔒 <span id="cancel-lock-timer-${oid}">--:--</span></span>`;
          }
        } else {
          actionsSection.innerHTML = '';
        }
      }
    };

    window.extractOTP = function (text) {
      if (!text) return '';
      const pattern = /(?:is|code|otp|login|is:)\s*(\d{4,8})\b/i;
      const match = text.match(pattern);
      if (match) return match[1];
      const allMatches = text.match(/\b\d{4,8}\b/g);
      if (allMatches && allMatches.length > 0) {
        const likely = allMatches.find(n => !n.startsWith('202'));
        return likely || allMatches[0];
      }
      return text;
    }

    window.toggleFullSMS = function (btn) {
      const item = btn.closest('.modern-sms-item');
      const full = item.querySelector('.modern-full-sms');
      if (full) {
        full.classList.toggle('visible');
        btn.style.color = full.classList.contains('visible') ? 'var(--accent)' : 'var(--text-3)';
      }
    }

    window._checkerCache = window._checkerCache || {};

    window.SUPPORTED_CHECKER_SERVICES = {
      gosats: 'GoSats',
      bigbasket: 'BigBasket',
      meesho: 'Meesho',
      plutos: 'Plutos',
      starexch: 'StarExch',
      swiggy: 'Swiggy',
      flipkart: 'Flipkart',
      shein: 'Shein',
      myntra: 'Myntra',
      oyo: 'OYO',
      mantrimall: 'MantriMall',
      blinkit: 'Blinkit',
      brevistay: 'BreviStay',
      ajio: 'Ajio',
      amazon: 'Amazon',
      jio: 'Jio',
      crownit: 'Crownit',
      telegram: 'Telegram',
      whatsapp: 'WhatsApp',
      habuildyoga: 'Habuild Yoga'
    };

    window.getCheckerKey = function(serviceName) {
      if (!serviceName || typeof serviceName !== 'string') return null;
      const s = serviceName.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (window.SUPPORTED_CHECKER_SERVICES[s]) return s;
      if (s.includes('gosats') || s === 'sats') return 'gosats';
      if (s.includes('bigbasket') || s === 'bb') return 'bigbasket';
      if (s.includes('meesho')) return 'meesho';
      if (s.includes('plutos')) return 'plutos';
      if (s.includes('starexch') || s.includes('starexchange')) return 'starexch';
      if (s.includes('swiggy')) return 'swiggy';
      if (s.includes('flipkart') || s === 'fk') return 'flipkart';
      if (s.includes('shein')) return 'shein';
      if (s.includes('myntra')) return 'myntra';
      if (s.includes('oyo')) return 'oyo';
      if (s.includes('mantrimall') || s === 'mantri') return 'mantrimall';
      if (s.includes('blinkit') || s.includes('grofers')) return 'blinkit';
      if (s.includes('brevistay') || s.includes('brevi')) return 'brevistay';
      if (s.includes('ajio')) return 'ajio';
      if (s.includes('amazon') || s === 'amz') return 'amazon';
      // Strict Jio rule: Exclude jiomart, jiocinema, etc.
      if (s.includes('jiomart') || s.includes('jiocinema') || s.includes('jiogames') || s.includes('jiomeet') || s.includes('jiopay')) {
        return null;
      }
      if (s === 'jio' || s === 'myjio' || s === 'reliancejio' || s === 'jiosim') return 'jio';

      if (s.includes('crownit')) return 'crownit';
      if (s.includes('telegram') || s === 'tg') return 'telegram';
      if (s.includes('whatsapp') || s === 'wa') return 'whatsapp';
      if (s.includes('habuildyoga') || s.includes('habuild')) return 'habuildyoga';
      return null;
    };

    window.isCheckerSupported = function(serviceName) {
      return window.getCheckerKey(serviceName) !== null;
    };

    window.getCheckerDisplayName = function(serviceName) {
      const key = window.getCheckerKey(serviceName);
      if (key && window.SUPPORTED_CHECKER_SERVICES[key]) {
        return window.SUPPORTED_CHECKER_SERVICES[key];
      }
      return serviceName || 'Service';
    };

    window.checkOrderRegistration = async function(oid, serviceName) {
      const btn = document.getElementById(`check-btn-${oid}`);
      const box = document.getElementById(`checker-box-${oid}`);
      const serviceTitle = getCheckerDisplayName(serviceName);

      if (btn) {
        btn.classList.add('loading');
        btn.innerHTML = `<div class="checker-spinner"></div><span>Checking...</span>`;
      }

      if (box) {
        box.style.display = 'flex';
        box.className = 'checker-result-box checking';
        box.innerHTML = `
          <div style="display:flex; align-items:center; gap:6px;">
            <div class="checker-spinner"></div>
            <span>Checking ${serviceTitle} registration status...</span>
          </div>
        `;
      }

      try {
        const res = await API.post(`/api/user/orders/${oid}/check`);
        const status = res.status; // 'registered' | 'not_registered' | 'error'
        window._checkerCache[oid] = { status, time: Date.now(), error: res.error };

        if (box) {
          if (status === 'registered') {
            box.className = 'checker-result-box registered';
            box.innerHTML = `
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="material-symbols-outlined" style="font-size:16px;">cancel</span>
                <span><strong>ALREADY REGISTERED</strong> on ${serviceTitle}</span>
              </div>
              <button onclick="event.stopPropagation(); checkOrderRegistration('${oid}', '${serviceName}')" style="background:none;border:none;color:inherit;cursor:pointer;opacity:0.8;font-size:11px;display:flex;align-items:center;gap:2px;" title="Re-check">
                <span class="material-symbols-outlined" style="font-size:14px;">refresh</span>
              </button>
            `;
            toast(`⚠️ Number is ALREADY REGISTERED on ${serviceTitle}!`, 'warning');
          } else if (status === 'not_registered') {
            box.className = 'checker-result-box not_registered';
            box.innerHTML = `
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="material-symbols-outlined" style="font-size:16px;">check_circle</span>
                <span><strong>NOT REGISTERED</strong> (Fresh number for ${serviceTitle})</span>
              </div>
              <button onclick="event.stopPropagation(); checkOrderRegistration('${oid}', '${serviceName}')" style="background:none;border:none;color:inherit;cursor:pointer;opacity:0.8;font-size:11px;display:flex;align-items:center;gap:2px;" title="Re-check">
                <span class="material-symbols-outlined" style="font-size:14px;">refresh</span>
              </button>
            `;
            toast(`✅ Number is FRESH (Not registered on ${serviceTitle})!`, 'success');
          } else {
            box.className = 'checker-result-box error';
            box.innerHTML = `
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="material-symbols-outlined" style="font-size:16px;">error</span>
                <span>${res.error || 'Check failed'}</span>
              </div>
              <button onclick="event.stopPropagation(); checkOrderRegistration('${oid}', '${serviceName}')" style="background:none;border:none;color:inherit;cursor:pointer;opacity:0.8;font-size:11px;display:flex;align-items:center;gap:2px;" title="Retry">
                <span class="material-symbols-outlined" style="font-size:14px;">refresh</span> Retry
              </button>
            `;
            toast(`Check failed: ${res.error || 'Server error'}`, 'error');
          }
        }
      } catch (err) {
        if (box) {
          box.className = 'checker-result-box error';
          box.innerHTML = `
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="material-symbols-outlined" style="font-size:16px;">error</span>
              <span>Failed to connect to checker</span>
            </div>
            <button onclick="event.stopPropagation(); checkOrderRegistration('${oid}', '${serviceName}')" style="background:none;border:none;color:inherit;cursor:pointer;opacity:0.8;font-size:11px;display:flex;align-items:center;gap:2px;" title="Retry">
              <span class="material-symbols-outlined" style="font-size:14px;">refresh</span> Retry
            </button>
          `;
        }
        toast('Checker error: ' + (err.message || 'Failed'), 'error');
      } finally {
        if (btn) {
          btn.classList.remove('loading');
          btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:15px;">verified_user</span><span>Check</span>`;
        }
      }
    };

    window.buyNewNumber = async function (serviceId) {
      if (!serviceId || serviceId === 'undefined' || serviceId === 'null') return toast("Service info missing", "error");
      if (window._isBuying) return;
      window._isBuying = true;
      const btn = event.currentTarget;
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner" style="width:14px;height:14px;border-width:2px;"></div>';
      toast("Allocating new number...", "info");
      try {
        const res = await API.post('/api/user/orders', { service_id: serviceId });
        playOtpSound();
        toast("New number allocated!", "success");
        if (res.order && res.order.order_id) switchOrder(res.order.order_id);
        else loadOrder();
      } catch (e) { toast(e.message || "Allocation failed", "error"); }
      finally { 
        window._isBuying = false;
        if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; } 
      }
    };

    window.rebuyNumber = async function (id) {
      const order = (window.__activeOrdersCache || []).find(item => String(item.order_id || item.id) === String(id)) || orderData;
      if (!order || String(order.order_id || order.id) !== String(id) || !order.can_rebuy || order.rebuy_order_id) {
        return toast('This order is not available to rebuy', 'error');
      }
      if (!await uiConfirm(`Rebuy this number for ${fmtMoney(order.cost)}? This will deduct the amount from your wallet.`)) return;
      if (window._isRebuying) return;
      window._isRebuying = true;
      try {
        if (typeof window.showPageLoader === 'function') window.showPageLoader();
        const result = await API.post(`/api/user/orders/${encodeURIComponent(id)}/rebuy`);
        toast('Same number rebought successfully', 'success');
        SPA.navigate(`/dashboard/orders/${encodeURIComponent(result.order.order_id)}`);
      } catch (error) {
        if (typeof window.hidePageLoader === 'function') window.hidePageLoader();
        toast(error.message || 'Could not rebuy this number', 'error');
      } finally {
        window._isRebuying = false;
      }
    };

    window.cancelForRebuy = async function (id) {
      const order = (window.__activeOrdersCache || []).find(item => String(item.order_id || item.id) === String(id)) || orderData;
      if (!order?.can_rebuy_after_cancel || order.rebuy_order_id) return toast('This order is not available for rebuy cancellation', 'error');
      if (!await uiConfirm('Cancel the completed provider activation so this same number can be rebought? The original purchase will remain completed.')) return;
      try {
        await API.post(`/api/user/orders/${encodeURIComponent(id)}/cancel-for-rebuy`);
        const refreshed = await API.get(`/api/user/orders/${encodeURIComponent(id)}`);
        window.__activeOrdersCache = (window.__activeOrdersCache || []).map(item =>
          String(item.order_id || item.id) === String(id) ? refreshed : item);
        if (String(orderData?.order_id || orderData?.id) === String(id)) orderData = refreshed;
        toast('Activation cancelled. You can now rebuy the same number.', 'success');
        loadActiveOrders();
      } catch (error) { toast(error.message || 'Could not cancel activation', 'error'); }
    };

    window.copyText = function (text, label = 'Text') {
      window.copyToClipboard(text, null, `${label} copied!`);
    }

    window.copyPhone = function (num) { copyText((num || '').replace(/^\+91/, ''), 'Phone number'); }

    window.formatTime = function (seconds) {
      if (seconds >= 60) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}m ${s}s`;
      }
      return `${seconds}s`;
    }

    window.renderInitialModernTimers = function (order) {
      return ''; // Removed timer cards as requested
    }

    window.__activeOrdersCache = [];

    window.loadActiveOrders = async function (prefetched = null) {
      try {
        let orders = prefetched;
        if (!orders) {
          const res = await API.get('/api/user/orders?status=active&limit=100');
          orders = res.orders || [];
        }

        const container = document.getElementById('modern-content');
        if (!container) return;

        // Start with a deep clone to prevent reference bleeding
        let mergedList = orders.map(o => JSON.parse(JSON.stringify(o)));

        // Ensure the "Current" order (if any) is included and up-to-date
        if (orderData) {
          const idx = mergedList.findIndex(o => String(o.order_id || o.id) === String(orderData.order_id || orderData.id));
          if (idx !== -1) mergedList[idx] = { ...mergedList[idx], ...orderData };
          else mergedList.push(JSON.parse(JSON.stringify(orderData)));
        }

        // Merge with existing cache to keep "Finished" orders on screen.
        // Fresh API data wins for otp/all_otps so stale cache doesn't bleed into wrong orders.
        window.__activeOrdersCache.forEach(cached => {
          const cid = String(cached.order_id || cached.id);
          const exists = mergedList.find(o => String(o.order_id || o.id) === cid);
          if (!exists) {
            // Keep finished/cached-only orders visible
            mergedList.push(JSON.parse(JSON.stringify(cached)));
          }
          // If the order IS in the fresh list, fresh API data already takes priority — no override needed
        });

        // Update the master cache with a fresh deep clone
        window.__activeOrdersCache = JSON.parse(JSON.stringify(mergedList));
        const allToShow = mergedList;

        if (allToShow.length > 0) {
          // Separate current order from others
          const currentOrderId = orderData ? String(orderData.order_id || orderData.id) : null;
          let currentOrderObj = null;
          let otherOrders = [];

          allToShow.forEach(o => {
            if (String(o.order_id || o.id) === currentOrderId) {
              currentOrderObj = o;
            } else {
              otherOrders.push(o);
            }
          });

          otherOrders.sort((a, b) => {
            const aFinished = ['cancelled', 'expired', 'refunded', 'completed'].includes(a.status);
            const bFinished = ['cancelled', 'expired', 'refunded', 'completed'].includes(b.status);

            // Step A: Active (Incomplete) vs Finished
            if (!aFinished && bFinished) return -1;
            if (aFinished && !bFinished) return 1;

            // Step B: Within Active, prioritize NO OTP (Waiting for first)
            if (!aFinished && !bFinished) {
              const aHasOtp = (a.all_otps && a.all_otps.length > 0) || a.otp;
              const bHasOtp = (b.all_otps && b.all_otps.length > 0) || b.otp;
              if (!aHasOtp && bHasOtp) return -1;
              if (aHasOtp && !bHasOtp) return 1;
            }

            const dateA = new Date(a.createdAt || a.created_at || 0).getTime();
            const dateB = new Date(b.createdAt || b.created_at || 0).getTime();
            return dateB - dateA;
          });

          let html = '';
          const totalCount = allToShow.length;

          if (currentOrderObj) {
            html += getModernUIHTML(currentOrderObj, null); // don't show badge for main order, or handle it
            
            const isCurrentFinished = ['cancelled', 'expired', 'refunded', 'completed'].includes(currentOrderObj.status);
            const hasOtherActives = otherOrders.some(o => !['cancelled', 'expired', 'refunded', 'completed'].includes(o.status));
            
            if (isCurrentFinished && hasOtherActives) {
              html += `<div style="display:flex; align-items:center; margin: 32px 0 16px 0;">
                         <div style="flex:1; height:1px; background:var(--border);"></div>
                         <div style="padding: 0 16px; font-size:12px; font-weight:800; color:var(--text-3); text-transform:uppercase; letter-spacing:1px;">Active Orders</div>
                         <div style="flex:1; height:1px; background:var(--border);"></div>
                       </div>`;
            } else if (otherOrders.length > 0 && !isCurrentFinished) {
              // Optionally add a separator if there are other orders and the current one is active
               html += `<div style="display:flex; align-items:center; margin: 32px 0 16px 0;">
                         <div style="flex:1; height:1px; background:var(--border);"></div>
                         <div style="padding: 0 16px; font-size:12px; font-weight:800; color:var(--text-3); text-transform:uppercase; letter-spacing:1px;">Other Orders</div>
                         <div style="flex:1; height:1px; background:var(--border);"></div>
                       </div>`;
            }
          }

          otherOrders.forEach((o, i) => { 
            html += getModernUIHTML(o, totalCount - i - 1); 
          });
          
          if (container.innerHTML !== html) {
            container.innerHTML = html;
          }
          
          allToShow.forEach(o => initOrderTimer(o));

          // Update Global Status Badge and Auto-Redirect
          const anyActive = allToShow.some(o => !['cancelled', 'expired', 'refunded', 'completed'].includes(o.status));
          const globalStatus = document.getElementById('status-badge');
          if (globalStatus) {
            if (anyActive) {
              window.__hadActiveOrders = true;
              globalStatus.className = 'status-badge active';
              globalStatus.innerHTML = '<span>Active</span>';
            } else if (allToShow.length > 0) {
              globalStatus.className = 'status-badge completed';
              globalStatus.innerHTML = '<span>Completed</span>';
              
              if (window.__hadActiveOrders && !window.__redirecting && !allToShow.some(o => o.can_rebuy || o.can_rebuy_after_cancel)) {
                window.__redirecting = true;
                setTimeout(() => {
                  window.location.href = '/dashboard/buy';
                }, 1000);
              }
            }
          }
        } else {
          container.innerHTML = '';
        }

      } catch (e) { console.warn('Failed to load active orders:', e); }
    }

    window.loadOrder = async function () {
      const modernContainer = document.getElementById('modern-content');
      if (!orderData && modernContainer) {
        modernContainer.style.display = 'block';
        modernContainer.innerHTML = `
          <div class="modern-card-container skeleton-shell" style="border-radius:24px; padding:24px;">
            <div class="modern-card-header" style="display:flex; justify-content:space-between; margin-bottom:20px">
              <div style="width:120px; height:24px; background:var(--border); border-radius:6px"></div>
              <div style="width:60px; height:24px; background:var(--border); border-radius:12px"></div>
            </div>
            <div style="height:60px; background:var(--border); border-radius:12px; margin-bottom:15px"></div>
            <div style="height:100px; background:var(--border); border-radius:12px"></div>
          </div>`;
      }
      clearAllIntervals();
      try {
        const [data, activeRes] = await Promise.all([
          API.get(`/api/user/orders/${orderId}`),
          API.get('/api/user/orders?status=active&limit=100').catch(() => ({ orders: [] }))
        ]);
        orderData = data;
        const activeOrders = activeRes.orders || [];
        updateUI(data, activeOrders);
        if (data.status === 'active') {
          if (window.__orderPollTimer) clearInterval(window.__orderPollTimer);
          window.__orderPollTimer = setInterval(async () => {
            if (document.hidden) return;
            try {
              const fresh = await API.get(`/api/user/orders/${orderId}`);
              if (!fresh) return;
              const prevOtpCount = orderData?.all_otps?.length || (orderData?.otp ? 1 : 0);
              const newOtpCount = fresh.all_otps?.length || (fresh.otp ? 1 : 0);
              if (fresh.status !== orderData?.status || newOtpCount > prevOtpCount) {
                window.handleRealtimeOrderUpdate({ orderId: fresh.order_id, status: fresh.status, otp: fresh.otp, all_otps: fresh.all_otps });
              }
              if (fresh.status !== 'active') { clearInterval(window.__orderPollTimer); window.__orderPollTimer = null; }
            } catch (_) { }
          }, 3000);
        } else {
          if (window.__orderPollTimer) { clearInterval(window.__orderPollTimer); window.__orderPollTimer = null; }
        }
      } catch (e) {
        console.warn("Order Load Error:", e.message);
        if (!orderData) showError(e.message || "Failed to connect.");
        else setTimeout(loadOrder, 10000);
      }
    }

    window.addEventListener('socket:order', (e) => {
      console.log("👂 Order Detail Page received socket:order event", e.detail);
      if (typeof window.handleRealtimeOrderUpdate === 'function') {
        window.handleRealtimeOrderUpdate(e.detail);
      }
    });

    window.handleRealtimeOrderUpdate = function (data) {
      if (!data) return;
      const oid = data.orderId || data.id;
      console.log(`[Realtime] Update for ${oid}:`, data);

      const cached = window.__activeOrdersCache.find(o => String(o.order_id || o.id) === oid);
      const prevCount = (cached?.all_otps && cached.all_otps.length > 0) ? cached.all_otps.length : (cached?.otp ? 1 : 0);
      const newCount = (data.all_otps && data.all_otps.length > 0) ? data.all_otps.length : (data.otp ? 1 : 0);

      const cachedIdx = window.__activeOrdersCache.findIndex(o => String(o.order_id || o.id) === oid);
      if (cachedIdx !== -1) {
        window.__activeOrdersCache[cachedIdx] = { ...window.__activeOrdersCache[cachedIdx], ...data };
      } else if (data.status === 'active') {
        window.__activeOrdersCache.push({ ...data, order_id: oid });
      }

      if (newCount > prevCount) {
        console.log(`[Realtime] New OTP detected for ${oid}!`);
        playOtpSound();
        setTimeout(() => {
          const card = document.getElementById(`modern-card-${oid}`);
          if (card) {
            const badgeEl = card.querySelector('.modern-order-badge');
            const orderNumStr = badgeEl ? badgeEl.innerText.toLowerCase() : '';
            if (typeof toast === 'function') toast(`New Otp recived in ${orderNumStr}`, "success");
            
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('otp-glow');
            setTimeout(() => card.classList.remove('otp-glow'), 3000);
          }
        }, 100);
      }

      if (String(oid) === String(orderId)) {
        console.log(`[Realtime] Current order ${oid} updated!`);
        orderData = { ...orderData, ...data };
        updateUI(orderData, window.__activeOrdersCache);
      } else {
        loadActiveOrders(window.__activeOrdersCache);
      }
    };

    window.copyOTP = async function (code) {
      try {
        const otp = code || orderData?.otp || (orderData?.all_otps ? orderData.all_otps[orderData.all_otps.length - 1] : null);
        if (!otp) { toast('No OTP to copy', 'error'); return; }
        copyText(otp, 'OTP');
      } catch (e) { toast('Failed to copy', 'error'); }
    }

    window.cancelOrder = async function (id) {
      if (window._isCancelling) return;
      
      const oid = id || orderId;
      if (!await uiConfirm('Cancel this order and refund to your wallet?')) return;
      
      window._isCancelling = true;

      // Disable the cancel button immediately to prevent double-clicks
      const btn = document.getElementById(`cancel-btn-${oid}`);
      if (btn) { btn.disabled = true; btn.innerHTML = '<div class="loading-spinner" style="width:14px;height:14px;border-width:2px;margin:0 auto"></div>'; }

      try {
        await API.post(`/api/user/orders/${oid}/cancel`);

        // Show toast FIRST before any re-render
        toast('Cancelled', 'success');

        // Then update UI
        const cachedIdx = (window.__activeOrdersCache || []).findIndex(o => String(o.order_id || o.id) === String(oid));
        if (cachedIdx !== -1) {
          window.__activeOrdersCache[cachedIdx].status = 'cancelled';
          if (String(oid) === String(orderId) && orderData) orderData.status = 'cancelled';
          loadActiveOrders(window.__activeOrdersCache);
        }
        loadOrder();
      } catch (e) { 
        toast(e.message || 'Failed to cancel order', 'error'); 
        if (btn) { btn.disabled = false; btn.innerHTML = '✕'; }
        loadOrder();
      } finally {
        window._isCancelling = false;
      }
    };

    window.retrySMS = async function () {
      if (!await uiConfirm('Request another SMS for this number?')) return;
      const btn = document.getElementById('retry-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div>'; }
      try {
        await API.post(`/api/user/orders/${orderId}/retry`);
        toast('SMS requested', 'success');
        loadOrder();
      } catch (e) { toast(e.message, 'error'); loadOrder(); }
    }

    window.buyNewOrder = async function () {
      const sid = orderData?.service_id || (typeof currentOrder !== 'undefined' ? currentOrder.service_id : null);
      if (!sid || sid === 'undefined') { toast("Order details not ready", "error"); return; }
      try {
        if (typeof window.showPageLoader === 'function') window.showPageLoader();
        const res = await API.post('/api/user/orders', { service_id: sid });
        if (typeof window.hidePageLoader === 'function') window.hidePageLoader();
        toast("Allocating new number...", "success");
        SPA.navigate(`/dashboard/orders/${res.order.order_id}`);
      } catch (e) {
        if (typeof window.hidePageLoader === 'function') window.hidePageLoader();
        toast(e.message || "Failed to buy new number", "error");
      }
    };

    window.addEventListener('beforeunload', () => {
      clearAllIntervals();
      if (window.__orderPollTimer) { clearInterval(window.__orderPollTimer); window.__orderPollTimer = null; }
    });
    loadOrder();
  </script>
</body>

</html>
