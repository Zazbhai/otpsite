name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Minimal default; jobs opt into exactly what they need.
permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG}  package.json=${VERSION}"
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: '*.tgz'

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@heleket-payment/sdk
    permissions:
      contents: read
      id-token: write # OIDC token for npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
